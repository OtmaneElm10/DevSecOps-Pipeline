server {

  listen 80;
  server_name eventapp.otmane-el-mouki.fr;

  return 301 https://$host$request_uri;
}

server {

  listen 80;
  server_name sonar.otmane-el-mouki.fr;

  return 301 https://$host$request_uri;

}



server {

  listen 443 ssl;
  server_name eventapp.otmane-el-mouki.fr;

  ssl_certificate /etc/letsencrypt/live/eventapp.otmane-el-mouki.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/eventapp.otmane-el-mouki.fr/privkey.pem;

 
  location / {
    root /usr/share/nginx/html;
    index index.html;
  }

  location /api/ {
    proxy_pass http://eventapp-backend:8081;
       
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

}


server {

  listen 443 ssl;
  server_name sonar.otmane-el-mouki.fr;

  ssl_certificate /etc/letsencrypt/live/sonar.otmane-el-mouki.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sonar.otmane-el-mouki.fr/privkey.pem;


  location / {
    
    proxy_pass http://sonarqube:9000;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
