<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer un Événement - Club de Foot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page"> <div class="auth-container" style="width: 500px;"> <h2>Nouvel Événement</h2>
        <form id="event-form">
            <input type="text" id="title" placeholder="Titre de l'activité" required>
            <textarea id="description" placeholder="Description de l'événement" required></textarea>
            <input type="text" id="lieu" placeholder="Lieu (ex: Stade de la Doua)" required>
            
            <div class="form-row">
                <input type="number" id="prix" placeholder="Prix (€)" step="0.01" required>
                <input type="number" id="capaciteMax" placeholder="Capacité max" required>
            </div>

            <label>Date et heure de début :</label>
            <input type="datetime-local" id="dateDebut" required>
            
            <label>Date et heure de fin :</label>
            <input type="datetime-local" id="dateFin" required>

            <button type="submit" class="btn-login">Créer l'événement</button>
            <p><a href="index.html">Annuler et retour</a></p>
        </form>
    </div>
    <script src="create-event.js"></script>
</body>
</html>
