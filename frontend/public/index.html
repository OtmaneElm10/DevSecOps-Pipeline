<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Club de Foot G17</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-box">
            <h1>Club de Foot G17</h1>
        </div>
        <div class="auth-buttons">
            <a href="mes-reservations.html" id="link-reservations" style="display: none;">
                <button class="btn-signup">Mes Réservations</button>
            </a>
            <a href="mes-paiements.html" id="link-payments" style="display: none;">
                <button class="btn-signup">Mes Paiements</button>
            </a>
            <a href="login.html" id="link-login" class="btn-login-link">
                <button class="btn-login">Login</button>
            </a>
            <a href="signup.html" id="link-signup" class="btn-signup-link">
                <button class="btn-signup">Signup</button>
            </a>
            <button id="btn-logout" class="btn-login" style="display: none;" onclick="logout()">Logout</button>
        </div>
    </header>
    <div class="filters-container">
        <button class="filter-btn active" data-type="">Tous</button>
        <button class="filter-btn" data-type="MATCH">Matchs</button>
        <button class="filter-btn" data-type="TOURNOI">Tournois</button>
        <button class="filter-btn" data-type="STAGE">Stages</button>
        <button class="filter-btn" data-type="SOIREE">Soirées</button>
    </div>
    <main id="event-list">
    </main>

    <script src="main.js"></script>
    <a href="create-event.html" id="btn-create-event" class="fab-button" style="display: none;">
        <span>Create event</span>
    </a>
</body>
</html>
