image: maven:3-eclipse-temurin-21-alpine

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

stages:
  - build
  - sonar
  - deploy

build:
  stage: build
  before_script:
    - apk add --no-cache openssh-client
    - chmod +x ci/setup-mvn-proxy.sh
    - ./ci/setup-mvn-proxy.sh
  script:
    - cd backend
    - mvn clean package -DskipTests
    - cp target/event-app-0.0.1-SNAPSHOT.jar app.jar
  artifacts:
    paths:
      - backend/app.jar

sonar:
  stage: sonar
  before_script:
    - chmod +x ci/setup-mvn-proxy.sh
    - ./ci/setup-mvn-proxy.sh
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script:
    - cd backend
    - mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
      -Dsonar.host.url=$SONAR_URL \
      -Dsonar.login=$SONAR_TOKEN
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

deploy:
  stage: deploy
  only:
    - main
    - fixpipeline
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
  script:
    - scp -o StrictHostKeyChecking=no backend/app.jar "$VM_USER@$VM_HOST:$VM_APP_DIR/app.jar"
    - ssh "$VM_USER@$VM_HOST" "sudo systemctl restart monapp && sudo systemctl status monapp --no-pager"