name: EventApp CI
on:
  push:
    branches:
    - main

  pull_request:
    branches:
      - main 

jobs:
  
  secret-scanning:
      name: Gitleaks scan 
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0 #fetch all commits, not only the last

        - name: Scan for secrets
          run : |
            docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --verbose --source /repo
             
  build:
    needs: secret-scanning
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilation
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Tests unitaires 
        working-directory: backend
        run: mvn test


  SonarQube:
    needs: build
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        
      - name: Scan & send to sonarqube server
        working-directory: backend
        run: |
          mvn verify sonar:sonar \
          -Dsonar.host.url=${{ secrets.SONAR_URL }} \
          -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
          -Dsonar.projectKey=event-app

  Semgrep:
    needs: build
    name: Semgrep SAST Analysis
    runs-on: ubuntu-latest
    steps:
    
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Backend SAST Scan
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=p/java \
            --config=p/owasp-top-ten \
            /src/backend \
            --error

      - name: Frontend SAST Scan
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=p/javascript \
            --config=p/owasp-top-ten \
            /src/frontend \
            --error

      - name: Pipeline SAST Scan
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=p/ci \
            /src/.github \
            --error
          
          
            
          
