name: EventApp CI
on:
  push:
    branches:
    - main

  pull_request:
    branches:
      - main 

jobs:
  
  secret-scanning:
      name: Gitleaks scan 
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
          with:
            fetch-depth: 0 #fetch all commits, not only the last

        - name: Scan for secrets
          run : |
            docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --verbose --source /repo
             
  build:
    needs: secret-scanning
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilation
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Tests unitaires 
        working-directory: backend
        run: mvn test


  SonarQube:
    needs: build
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
        
      - name: Scan & send to sonarqube server
        working-directory: backend
        run: |
          mvn verify sonar:sonar \
          -Dsonar.host.url=${{ secrets.SONAR_URL }} \
          -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
          -Dsonar.projectKey=event-app

  Semgrep:
    needs: build
    name: Semgrep SAST Analysis
    runs-on: ubuntu-latest
    steps:
    
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Backend main SAST Scan
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=p/java \
            --config=p/owasp-top-ten \
            /src/backend \
            --verbose \
            --error
            
      - name: Backend Particular cases
        run: |
          docker run --rm \
          -v "${PWD}:/src" \
          semgrep/semgrep \
          semgrep scan \
          --config=security/semgrep/jwt-security/hardcoded-jwt.yml \
          --config=security/semgrep/jwt-security/jwt-none-alg.yml \
          --config=security/semgrep/jwt-security/info-logger.yml \
          /src/backend \
          --verbose \
          --error
          
      
      - name: Frontend SAST Scan
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=p/javascript \
            --config=p/owasp-top-ten \
            /src/frontend \
            --verbose \
            --error

      - name: Pipeline SAST Scan
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=p/ci \
            /src/.github \
            --verbose \
            --error


  SCA:
    needs: build
    name: SCA scan 
    runs-on: ubuntu-latest

    steps:

      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Java
        uses:  actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Cache dependency-check database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .dependency-check-data # dossier à mettre en cache pour le prochain runner
          key: dependency-check-${{ runner.os }} #identifiant

          

      - name: OWASP dependency-check scan
        working-directory: backend
        run: |
          mvn org.owasp:dependency-check-maven:check \
          -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
          -DdataDirectory=${{ github.workspace }}/.dependency-check-data \
          -Dformats=HTML

      
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html


    


        
          
        
        
    
          
          
            
          
