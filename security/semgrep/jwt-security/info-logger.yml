rules:
  id: no-jwt-token-logging
  languages:
    - java

  message: >-
    Sensitive token detected in application logs.
    Do not log JWTs or authentification tokens.

  severity: ERROR

  patterns:
    - pattern-either:
        - pattern: $LOGGER.info(..., $TOKEN, ...)
        - pattern: $LOGGER.warn(..., $TOKEN, ...)
        - pattern: $LOGGER.error(..., $TOKEN, ...)
        - pattern: $LOGGER.debug(..., $TOKEN, ...)
        - pattern: System.out.println($TOKEN)

     - metavariable-regex:
         metavariable: $TOKEN
         regex: "(?i).*(jwt|token|accessToken|refreshToken).*"
