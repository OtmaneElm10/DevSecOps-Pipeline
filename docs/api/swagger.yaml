openapi: 3.0.3
info:
  title: EventApp API
  version: 1.0.0
  description: API for club event management.

servers:
  - url: http://192.168.75.61

tags:
  - name: Auth
  - name: Events
  - name: Reservations
  - name: Paiements
  - name: Matchs
  - name: Inscriptions tournoi

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/events:
    get:
      tags: [Events]
      summary: Get all events (optionally filtered by type)
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventType'
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      tags: [Events]
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/events/{id}:
    get:
      tags: [Events]
      summary: Get event by id
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Event found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Events]
      summary: Update an event
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Events]
      summary: Delete an event
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '204':
          description: Event deleted
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
      required:
        - username
        - email
        - password

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string

    EventType:
      type: string
      enum:
        - MATCH
        - TOURNOI
        - STAGE
        - SOIREE

    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        lieu:
          type: string
        dateDebut:
          type: string
          format: date
        dateFin:
          type: string
          format: date
        capaciteMax:
          type: integer
        prix:
          type: number
        type:
          $ref: '#/components/schemas/EventType'
      required:
        - id
        - title
        - lieu
        - type

    EventCreateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        lieu:
          type: string
        dateDebut:
          type: string
          format: date
        dateFin:
          type: string
          format: date
        capaciteMax:
          type: integer
        prix:
          type: number
        type:
          $ref: '#/components/schemas/EventType'
      required:
        - title
        - lieu
        - type