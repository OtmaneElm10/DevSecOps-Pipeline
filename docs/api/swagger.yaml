openapi: 3.0.3
info:
  title: EventApp API
  version: 1.0.0
  description: API for club event management.

servers:
  - url: http://192.168.75.61

tags:
  - name: Auth
  - name: Users
  - name: Events
  - name: Reservations
  - name: Paiements
  - name: Matchs
  - name: Inscriptions tournoi

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{username}:
    get:
      tags: [Users]
      summary: Get user by username
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/events:
    get:
      tags: [Events]
      summary: Get all events (optionally filtered by type)
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventType'
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      tags: [Events]
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/events/{id}:
    get:
      tags: [Events]
      summary: Get event by id
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Event found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Events]
      summary: Update an event
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Events]
      summary: Delete an event
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '204':
          description: Event deleted
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservations:
    get:
      tags: [Reservations]
      summary: Get all reservations
      responses:
        '200':
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
    post:
      tags: [Reservations]
      summary: Create a new reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          description: Invalid reservation data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User or event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Not enough available places
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservations/user/{userId}:
    get:
      tags: [Reservations]
      summary: Get reservations by user ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of reservations for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reservations/{reservationId}:
    delete:
      tags: [Reservations]
      summary: Cancel a reservation
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Reservation deleted
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/paiements:
    get:
      tags: [Paiements]
      summary: Get all payments
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Paiement'
    post:
      tags: [Paiements]
      summary: Create a new payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaiementCreateRequest'
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paiement'
        '400':
          description: Invalid payment data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/paiements/{id}:
    get:
      tags: [Paiements]
      summary: Get payment by ID
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paiement'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/paiements/{id}/status:
    get:
      tags: [Paiements]
      summary: Get payment status by ID
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Payment status found
          content:
            application/json:
              schema:
                type: string
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
      required:
        - username
        - email
        - password

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string

    EventType:
      type: string
      enum:
        - MATCH
        - TOURNOI
        - STAGE
        - SOIREE

    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        lieu:
          type: string
        dateDebut:
          type: string
          format: date
        dateFin:
          type: string
          format: date
        capaciteMax:
          type: integer
        prix:
          type: number
        type:
          $ref: '#/components/schemas/EventType'
      required:
        - id
        - title
        - lieu
        - type

    EventCreateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        lieu:
          type: string
        dateDebut:
          type: string
          format: date
        dateFin:
          type: string
          format: date
        capaciteMax:
          type: integer
        prix:
          type: number
        type:
          $ref: '#/components/schemas/EventType'
      required:
        - title
        - lieu
        - type

    Reservation:
      type: object
      properties:
        id:
          type: integer
        nbPlaces:
          type: integer
        statut:
          type: string
        dateCreation:
          type: string
          format: date
        montantAttendu:
          type: number
        user:
          $ref: '#/components/schemas/UserReference'
        event:
          $ref: '#/components/schemas/EventReference'
      required:
        - id
        - nbPlaces
        - statut
        - dateCreation
        - user
        - event

    ReservationCreateRequest:
      type: object
      properties:
        nbPlaces:
          type: integer
        statut:
          type: string
        dateCreation:
          type: string
          format: date
        montantAttendu:
          type: number
        user:
          $ref: '#/components/schemas/UserReference'
        event:
          $ref: '#/components/schemas/EventReference'
      required:
        - nbPlaces
        - user
        - event

    UserReference:
      type: object
      properties:
        id:
          type: integer
      required:
        - id

    EventReference:
      type: object
      properties:
        id:
          type: integer
      required:
        - id

    Paiement:
      type: object
      properties:
        id:
          type: integer
        montant:
          type: number
        statut:
          type: string
        datePaiement:
          type: string
          format: date
        reservation:
          $ref: '#/components/schemas/ReservationReference'
      required:
        - id
        - montant
        - statut
        - reservation

    PaiementCreateRequest:
      type: object
      properties:
        montant:
          type: number
        statut:
          type: string
        datePaiement:
          type: string
          format: date
        reservation:
          $ref: '#/components/schemas/ReservationReference'
      required:
        - montant
        - reservation

    ReservationReference:
      type: object
      properties:
        id:
          type: integer
      required:
        - id